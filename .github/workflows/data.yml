name: Collect and publish performances
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: moa-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify collector
        run: python -m unittest discover -s tools/tests -v
      - uses: actions/cache/restore@v4
        with:
          path: public
          key: kopis-v3-${{ github.run_id }}
          restore-keys: kopis-v3-
      - name: Collect and validate
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: python tools/collect.py --output public --months 6
      - uses: actions/cache/save@v4
        with:
          path: public
          key: kopis-v3-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy complete snapshot
        id: deployment
        uses: actions/deploy-pages@v4
